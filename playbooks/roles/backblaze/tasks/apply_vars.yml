- set_fact:
    flag_backups: []

- name: "Enable MySQL backups"
  set_fact:
    flag_backups: "{{ flag_backups + ['/var/lib/mysql'] }}"
  when: flags["mysql"]

- name: "Enable MongoDB backups"
  set_fact:
    flag_backups: "{{ flag_backups + ['/var/lib/mongodb'] }}"
  when: flags["mongodb"]

- name: "Enable Pelican Panel backups"
  set_fact:
    flag_backups: "{{ flag_backups + ['/var/www/pelican'] }}"
  when: flags["pelican"]

- name: "Enable Wings backups"
  set_fact:
    flag_backups: "{{ flag_backups + ['/etc/pelican/config.yml', '/var/lib/pelican/volumes', '/var/lib/pelican/wings.db', '/var/lib/pelican/states.json'] }}"
  when: flags["wings"]