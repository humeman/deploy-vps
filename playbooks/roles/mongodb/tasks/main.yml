- name: Install python3-debian for repository management
  ansible.builtin.apt:
    name: python3-debian
    state: present
  become: true

- name: Remove legacy MongoDB apt source and keyring (from old install.sh)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/mongodb-org-6.0.list
    - /usr/share/keyrings/mongodb.gpg
  become: true

- name: Add MongoDB apt repository
  ansible.builtin.deb822_repository:
    name: mongodb-org-6.0
    types: deb
    uris: https://repo.mongodb.org/apt/ubuntu
    suites: "{{ version_name if version_name != 'noble' else 'jammy' }}/mongodb-org/6.0"
    components: multiverse
    architectures:
      - amd64
      - arm64
    signed_by: https://www.mongodb.org/static/pgp/server-6.0.asc
  become: true
  register: mongodb_repo

- name: Update apt cache after adding MongoDB repository
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: mongodb_repo.changed

- name: Install MongoDB and its Python driver
  ansible.builtin.apt:
    pkg:
      - mongodb-org
      - python3-pymongo
    state: present
  become: true

- name: Deploy mongod configuration
  ansible.builtin.template:
    src: ../files/mongod.conf
    dest: /etc/mongod.conf
    owner: root
    group: root
  become: true
  register: mongod_conf

- name: Enable and start mongod
  ansible.builtin.systemd:
    name: mongod.service
    state: started
    scope: system
    enabled: true
  become: true

- name: Restart mongod on configuration change
  ansible.builtin.systemd:
    name: mongod.service
    state: restarted
    scope: system
  become: true
  when: mongod_conf.changed

- name: Create MongoDB admin user
  community.mongodb.mongodb_user:
    login_host: localhost
    database: admin
    name: admin
    password: "{{ mongodb['admin_password'] }}"
    roles:
      - userAdminAnyDatabase
    create_for_localhost_exception: /etc/mongod_admin_created
  become: true
