- name: Install Pelican dependencies (1)
  ansible.builtin.apt:
    update_cache: no
    pkg:
    - software-properties-common
    - curl
    - apt-transport-https
    - ca-certificates
    - gnupg
  become: true

- name: Install Pelican dependencies (2)
  ansible.builtin.apt:
    update_cache: no
    pkg:
    - php{{ dependency_versions["php"] }}
    - php{{ dependency_versions["php"] }}-common
    - php{{ dependency_versions["php"] }}-cli
    - php{{ dependency_versions["php"] }}-gd
    - php{{ dependency_versions["php"] }}-mysql
    - php{{ dependency_versions["php"] }}-mbstring
    - php{{ dependency_versions["php"] }}-bcmath
    - php{{ dependency_versions["php"] }}-xml
    - php{{ dependency_versions["php"] }}-fpm
    - php{{ dependency_versions["php"] }}-curl
    - php{{ dependency_versions["php"] }}-zip
    - php{{ dependency_versions["php"] }}-intl
    - php{{ dependency_versions["php"] }}-sqlite3
    - tar
    - nginx
    - unzip
    - git
    - redis-server
  become: true

- name: Enable Redis
  ansible.builtin.systemd:
    name: redis-server.service
    state: started
    scope: system
    enabled: true
  become: true

- name: Download Composer PHAR
  ansible.builtin.get_url:
    url: "https://getcomposer.org/download/latest-stable/composer.phar"
    dest: /usr/local/bin/composer.phar
    mode: "0755"
  become: true

- name: Create symlink for Composer
  ansible.builtin.file:
    src: /usr/local/bin/composer.phar
    dest: /usr/local/bin/composer
    state: link
  become: true
