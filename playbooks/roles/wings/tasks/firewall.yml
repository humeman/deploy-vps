- name: Add UFW rules for Pelican game ports (TCP)
  community.general.ufw:
    rule: allow
    to_port: '{{ item["port"] }}'
    to_ip: '{{ item["host"] }}'
    proto: "tcp"
    comment: Allow Pelican {{ item["host"] }}:{{ item["port"] }} connections (TCP)
  loop: '{{ pelican["ports"] }}'
  become: true

- name: Add UFW rules for Pelican game ports (UDP)
  community.general.ufw:
    rule: allow
    to_port: '{{ item["port"] }}'
    to_ip: '{{ item["host"] }}'
    proto: "udp"
    comment: Allow Pelican {{ item["host"] }}:{{ item["port"] }} connections (UDP)
  loop: '{{ pelican["ports"] }}'
  become: true

- name: Add UFW rules for Wings panel-node communication
  community.general.ufw:
    rule: allow
    to_port: "8080"
    comment: Allow Wings node connections
  become: true

- name: Add UFW rules for Wings SFTP
  community.general.ufw:
    rule: allow
    to_port: "2022"
    comment: Allow Wings node connections
  become: true