# Native equivalent of mysql_secure_installation's key steps.
- name: Remove anonymous MySQL users
  community.mysql.mysql_user:
    name: ''
    host_all: true
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock
  become: true

- name: Remove remote MySQL root accounts
  community.mysql.mysql_user:
    name: root
    host: "{{ item }}"
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock
  loop:
    - "{{ ansible_hostname }}"
    - "{{ ansible_fqdn }}"
    - "%"
  become: true

- name: Remove MySQL test database
  community.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock
  become: true
